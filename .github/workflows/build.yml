name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS plugin (VST3 + AU, universal) and installer
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DMASCARA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --target Mascara_VST3 Mascara_AU MascaraTest MascaraHostCheck -j 4

      - name: Engine checks (synthetic voice: pitch, formant, quantize, robot, doubler, CPU)
        run: build/MascaraTest

      - name: Engine checks on real speech
        run: |
          set -e
          mkdir -p speech
          ok=1
          curl -fsSL -o speech/a.wav https://raw.githubusercontent.com/r9y9/pysptk/master/pysptk/example_audio_data/arctic_a0007.wav || ok=0
          curl -fsSL -o speech/b.wav https://raw.githubusercontent.com/mmorise/World/master/test/vaiueo2d.wav || ok=0
          if [ "$ok" = 0 ]; then echo "::warning::speech samples not downloadable, skipped"; exit 0; fi
          for f in a b; do afconvert -f WAVE -d LEF32@48000 -c 1 speech/$f.wav speech/${f}48.wav; done
          build/MascaraTest --speech-only --speech speech/a48.wav --speech speech/b48.wav

      - name: Host check (layouts, presets, state, editor snapshot)
        run: |
          H=$(find build/MascaraHostCheck_artefacts -type f -name MascaraHostCheck -perm -u+x | head -1)
          "$H" editor.png

      - name: Sign (ad hoc) and package
        run: |
          set -e
          ART=build/Mascara_artefacts/Release
          mkdir -p dist
          cp -R "$ART/VST3/Mascara.vst3" dist/
          cp -R "$ART/AU/Mascara.component" dist/
          for b in dist/Mascara.vst3 dist/Mascara.component; do codesign --force --deep --sign - "$b"; done
          lipo -info dist/Mascara.vst3/Contents/MacOS/Mascara
          cp docs/INSTALL-mac.txt dist/
          VERSION=$(sed -n 's/^project(Mascara VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd dist && zip -qry ../Mascara-macOS.zip .)

      - name: Build installer
        run: installer/build_pkg.sh "$VERSION" dist pkg

      - name: Test the installer (fresh install and update over it)
        run: |
          set -e
          rm -rf ~/Library/Audio/Plug-Ins/VST3/Mascara.vst3 ~/Library/Audio/Plug-Ins/Components/Mascara.component
          installer -pkg "pkg/Mascara-$VERSION.pkg" -target CurrentUserHomeDirectory
          test -f ~/Library/Audio/Plug-Ins/VST3/Mascara.vst3/Contents/MacOS/Mascara
          test -f ~/Library/Audio/Plug-Ins/Components/Mascara.component/Contents/MacOS/Mascara
          installer -pkg "pkg/Mascara-$VERSION.pkg" -target CurrentUserHomeDirectory
          cmp ~/Library/Audio/Plug-Ins/VST3/Mascara.vst3/Contents/MacOS/Mascara dist/Mascara.vst3/Contents/MacOS/Mascara
          codesign --verify --deep ~/Library/Audio/Plug-Ins/VST3/Mascara.vst3
          echo "installer OK"

      - name: Validate VST3 with pluginval
        run: |
          set -e
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 900000 --output-dir pluginval-logs dist/Mascara.vst3

      - name: Validate AU with auval (installed by the installer)
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumf Masc Dnsh

      - uses: actions/upload-artifact@v4
        with:
          name: Mascara-installer
          path: pkg/Mascara-${{ env.VERSION }}.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: Mascara-macOS
          path: Mascara-macOS.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            editor.png
            pluginval-logs
          if-no-files-found: ignore

      - name: Publish the latest build to the "downloads" branch
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p pub && cp "pkg/Mascara-$VERSION.pkg" pub/ && cp Mascara-macOS.zip pub/ && cp docs/INSTALL-mac.txt pub/
          cd pub
          printf '# Máscara %s\n\nУстановщик: **Mascara-%s.pkg** (нажмите на файл, затем «Download raw file»).\nСборка из коммита %s.\n' "$VERSION" "$VERSION" "${GITHUB_SHA::7}" > README.md
          git init -q -b downloads
          git config user.name "Mascara CI"; git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Mascara $VERSION (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" downloads

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mascara-macOS.zip
            pkg/Mascara-${{ env.VERSION }}.pkg
