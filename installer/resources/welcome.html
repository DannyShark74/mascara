<h2>Máscara — питч, форманты и голос</h2>
<p>Установщик положит плагин в вашу папку пользователя и заменит предыдущую версию:</p>
<ul>
<li><b>VST3</b> → ~/Library/Audio/Plug-Ins/VST3</li>
<li><b>Audio Unit</b> → ~/Library/Audio/Plug-Ins/Components</li>
</ul>
<p>Перед установкой закройте FL Studio или другую DAW.</p>
