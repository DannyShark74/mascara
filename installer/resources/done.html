<h2>Готово</h2>
<p>Откройте FL Studio → <b>Options → Manage plugins → Find installed plugins</b>.
Máscara появится в списке эффектов (VST3: «Mascara», производитель Danny Shark).</p>
<p>Ставьте на канал с одним голосом (лид, бэк, дабл). На аккорды и хор плагин не рассчитан:
он отслеживает одну ноту.</p>
